<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة التنظيف بالواقع المختلط - Passthrough</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: Tahoma, sans-serif; overflow: hidden; }
        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 10;
        }
        .hud-item { margin-bottom: 8px; font-size: 16px; }
        #arButton {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.5);
        }
        #shopModal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #111827;
            border: 2px solid #10b981;
            padding: 25px;
            border-radius: 15px;
            z-index: 100;
            width: 350px;
            text-align: center;
        }
        .btn { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
    <!-- مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <div class="hud-item">المرحلة: <span id="currentStage">1</span> / 100</div>
        <div class="hud-item">الرصيد: <span id="playerCoins">0.00</span> 🪙</div>
        <div class="hud-item">العائد لكل نقطة: <span id="coinRate">0.50</span></div>
        <button class="btn" onclick="toggleShop()">🛒 المتجر</button>
    </div>

    <button id="arButton" onclick="startARSession()">🥽 تفعيل وضع الـ AR (Passthrough)</button>

    <div id="shopModal">
        <h2>متجر أدوات التنظيف</h2>
        <p>الأدوات المشتراة تنتقل معك للمراحل المتقدمة تلقائياً!</p>
        <button class="btn" onclick="buyTool('ممسحة سريعة', 10)">شراء ممسحة سريعة (10 🪙)</button><br>
        <button class="btn" style="background:#ef4444;" onclick="toggleShop()">إغلاق</button>
    </div>

    <script>
        let stage = 1;
        let coins = 0.0;
        let currentCoinRate = 0.50;
        let xrSession = null;

        function updateStageSettings(newStage) {
            stage = newStage;
            currentCoinRate = stage * 0.50;
            document.getElementById('currentStage').innerText = stage;
            document.getElementById('coinRate').innerText = currentCoinRate.toFixed(2);
        }

        // بدء جلسة الواقع المختلط مع تفعيل الكاميرا الخلفية (Passthrough) وتتبع اليدين
        async function startARSession() {
            if (navigator.xr) {
                try {
                    xrSession = await navigator.xr.requestSession('immersive-ar', {
                        requiredFeatures: ['hit-test', 'local-floor', 'hand-tracking']
                    });
                    
                    document.getElementById('arButton').style.display = 'none';
                    alert("تم تفعيل وضع الـ Passthrough بنجاح! بيتك الحقيقي ظاهر أمامك الآن.");

                    // جلب خريطة البيت من السيرفر بالتزامن مع الدخول
                    fetchHouseMap();

                    xrSession.addEventListener('end', () => {
                        xrSession = null;
                        document.getElementById('arButton').style.display = 'block';
                    });

                } catch (e) {
                    alert("فشل تشغيل جلسة AR: " + e.message);
                }
            } else {
                alert("متصفحك لا يدعم WebXR. يرجى الفتح من متصفح نظارة الكويست.");
            }
        }

        function toggleShop() {
            const modal = document.getElementById('shopModal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function buyTool(toolName, cost) {
            if (coins >= cost) {
                coins -= cost;
                document.getElementById('playerCoins').innerText = coins.toFixed(2);
                alert(`تم شراء ${toolName}! سترافقك في المراحل القادمة.`);
                toggleShop();
            } else {
                alert("رصيد العملات غير كافي!");
            }
        }

        async function fetchHouseMap() {
            try {
                const response = await fetch('https://game-4jxf.onrender.com/api/get-house');
                const houseData = await response.json();
                console.log("تم إسقاط الأوساخ فوق أثاث بيتك الحقيقي بنجاح:", houseData);
            } catch (e) {
                console.log("بانتظار مزامنة خريطة البيت من موقع المسح.");
            }
        }

        updateStageSettings(1);
    </script>
</body>
</html>
