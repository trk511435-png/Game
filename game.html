<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيئة اللعب الفعليه - AR Passthrough</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { margin: 0; background: transparent; color: #fff; font-family: 'Tajawal', sans-serif; overflow: hidden; user-select: none; }
        
        #gameHud {
            position: absolute; top: 20px; right: 20px;
            background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(16, 185, 129, 0.4); padding: 20px; border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); z-index: 10; width: 260px;
        }
        .hud-header { font-size: 13px; color: #10b981; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; }
        .hud-value { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 10px; }

        #arButton {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #059669, #10b981); color: white; border: 2px solid #34d399;
            padding: 16px 32px; font-size: 18px; font-weight: 900; border-radius: 50px; cursor: pointer;
            z-index: 10; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.6); font-family: 'Tajawal', sans-serif;
        }

        #shopModal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(11, 19, 38, 0.98); backdrop-filter: blur(20px); border: 2px solid #10b981;
            padding: 25px; border-radius: 24px; z-index: 100; width: 380px; text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
        }
        .game-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none;
            padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 15px;
            margin-top: 10px; width: 100%; transition: 0.2s; font-family: 'Tajawal', sans-serif;
        }
        .close-btn { background: linear-gradient(135deg, #dc2626, #b91c1c); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="gameHud">
        <div class="hud-header">المستوى الحالي</div>
        <div class="hud-value" id="currentStage">المرحلة 1 / 100</div>
        
        <div class="hud-header">الرصيد المكتسب</div>
        <div class="hud-value" id="playerCoins">0.00 🪙</div>
        
        <div class="hud-header">معدل العائد</div>
        <div class="hud-value" id="coinRate" style="font-size: 16px; color: #34d399;">+0.50 لكل نقطة</div>

        <button class="game-btn" onclick="toggleShop()">🛒 المتجر الحقيقي</button>
        <button class="game-btn" style="background:#10b981;" onclick="simulateCleaning()">🧹 محاكاة تنظيف نقطة</button>
    </div>

    <button id="arButton" onclick="startARSession()">🥽 تفعيل Passthrough والواقع المختلط</button>

    <div id="shopModal">
        <h2>متجر الأدوات الحقيقي</h2>
        <p style="color: #94a3b8; font-size: 13px;">الأدوات تُحفظ معك تلقائياً وتنتقل للمراحل القادمة!</p>
        <button class="game-btn" onclick="buyTool('ممسحة الليزر', 10)">شراء ممسحة الليزر (10 🪙)</button>
        <button class="game-btn" onclick="buyTool('بخاخ الأيونات', 25)">شراء بخاخ الأيونات (25 🪙)</button>
        <button class="game-btn close-btn" onclick="toggleShop()">إغلاق المتجر</button>
    </div>

    <script>
        let stage = parseInt(localStorage.getItem('game_stage') || 1);
        let coins = parseFloat(localStorage.getItem('game_coins') || 0.0);
        let currentCoinRate = stage * 0.50;
        let xrSession = null;

        // تحديث الواجهة بالبيانات الحقيقية
        function updateUI() {
            document.getElementById('currentStage').innerText = `المرحلة ${stage} / 100`;
            document.getElementById('playerCoins').innerText = `${coins.toFixed(2)} 🪙`;
            document.getElementById('coinRate').innerText = `+${currentCoinRate.toFixed(2)} للنقطة`;
            
            localStorage.setItem('game_stage', stage);
            localStorage.setItem('game_coins', coins);
        }

        // محاكاة تنظيف الأوساخ الحقيقية وكسب العملات حسب المعادلة (Stage * 0.50)
        function simulateCleaning() {
            coins += currentCoinRate;
            updateUI();
            
            // إذا جمعت كفاية، اصعد مرحلة جديدة تلقائياً كمثال للتصاعد
            if (coins >= stage * 10) {
                stage++;
                currentCoinRate = stage * 0.50;
                alert(`مبروك! صعدت إلى المرحلة ${stage}! زاد معدل الأرباح.`);
            }
            syncWithServer();
        }

        function toggleShop() {
            const modal = document.getElementById('shopModal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function buyTool(toolName, cost) {
            if (coins >= cost) {
                coins -= cost;
                updateUI();
                alert(`تم شراء [${toolName}] وحفظها بنجاح في حقيبتك الدائمة!`);
                toggleShop();
                syncWithServer();
            } else {
                alert("الرصيد غير كافي! نظف المزيد لتجميع العملات.");
            }
        }

        // تشغيل جلسة الـ AR الحقيقية (Passthrough + Hand Tracking) على نظارة الكويست
        async function startARSession() {
            if (navigator.xr) {
                try {
                    xrSession = await navigator.xr.requestSession('immersive-ar', {
                        requiredFeatures: ['hit-test', 'local-floor', 'hand-tracking']
                    });
                    document.getElementById('arButton').style.display = 'none';
                    alert("تم تشغيل وضع الـ Passthrough والواقع المختلط بنجاح!");
                    
                    // جلب بيانات البيت من السيرفر
                    fetchHouseMap();

                    xrSession.addEventListener('end', () => {
                        xrSession = null;
                        document.getElementById('arButton').style.display = 'block';
                    });
                } catch (e) {
                    alert("فشل تشغيل AR: " + e.message);
                }
            } else {
                alert("متصفحك لا يدعم WebXR. يرجى الفتح من متصفح نظارة الكويست.");
            }
        }

        // مزامنة البيانات مع سيرفر Render الحقيقي
        async function fetchHouseMap() {
            try {
                const response = await fetch('https://game-4jxf.onrender.com/api/get-house');
                const data = await response.json();
                console.log("تم سحب خريطة البيت وإحداثيات الأثاث من السيرفر بنجاح:", data);
            } catch (e) {
                console.log("جارِ الاتصال بالسيرفر...");
            }
        }

        async function syncWithServer() {
            try {
                await fetch('https://game-4jxf.onrender.com/api/save-house', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stage: stage, coins: coins, floor: localStorage.getItem('selected_floor') })
                });
            } catch (e) {
                console.log("تم الحفظ محلياً بانتظار استجابة السيرفر.");
            }
        }

        updateUI();
    </script>
</body>
</html>
