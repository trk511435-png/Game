<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيئة التنظيف الواقعية - AR</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: Tahoma, sans-serif; overflow: hidden; }
        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 10;
        }
        .hud-item { margin-bottom: 8px; font-size: 16px; }
        #shopModal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #111827;
            border: 2px solid #10b981;
            padding: 25px;
            border-radius: 15px;
            z-index: 100;
            width: 350px;
            text-align: center;
        }
        .btn { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
    <!-- مكتبة Three.js لدعم العرض الثلاثي الأبعاد والواقع المختلط -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <div class="hud-item">المرحلة: <span id="currentStage">1</span> / 100</div>
        <div class="hud-item">الرصيد: <span id="playerCoins">0.00</span> 🪙</div>
        <div class="hud-item">العائد لكل نقطة: <span id="coinRate">0.50</span></div>
        <button class="btn" onclick="toggleShop()">🛒 المتجر</button>
    </div>

    <div id="shopModal">
        <h2>متجر أدوات التنظيف</h2>
        <p>اشتري أدوات تنتقل معك للمراحل القادمة وتسهل التنظيف!</p>
        <button class="btn" onclick="buyTool('ممسحة سريعة', 10)">شراء ممسحة سريعة (10 🪙)</button><br>
        <button class="btn" style="background:#ef4444;" onclick="toggleShop()">إغلاق</button>
    </div>

    <script>
        let stage = 1;
        let coins = 0.0;
        let currentCoinRate = 0.50;

        // حساب معدل الربح بناءً على المرحلة (المرحلة × 0.50)
        function updateStageSettings(newStage) {
            stage = newStage;
            currentCoinRate = stage * 0.50;
            document.getElementById('currentStage').innerText = stage;
            document.getElementById('coinRate').innerText = currentCoinRate.toFixed(2);
        }

        // محاكاة تنظيف الأوساخ واكتساب العملات بـ AR اليدين
        function cleanDirtItem() {
            coins += currentCoinRate;
            document.getElementById('playerCoins').innerText = coins.toFixed(2);
        }

        function toggleShop() {
            const modal = document.getElementById('shopModal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function buyTool(toolName, cost) {
            if (coins >= cost) {
                coins -= cost;
                document.getElementById('playerCoins').innerText = coins.toFixed(2);
                alert(`تم شراء ${toolName} بنجاح! سترافقك في المراحل القادمة.`);
                toggleShop();
            } else {
                alert("رصيدك غير كافي! نظف المزيد لتجمع العملات.");
            }
        }

        // جلب خريطة البيت المسجلة من سيرفر Render عند تشغيل اللعبة
        async function fetchHouseMap() {
            try {
                const response = await fetch('https://game-4jxf.onrender.com/api/get-house');
                const houseData = await response.json();
                console.log("تم تحميل إحداثيات الأثاث الحقيقي لبيتك:", houseData);
                // هنا سيتم إسقاط الأوساخ افتراضياً فوق الأثاث الحقيقي المستخرج من مسح النظارة
            } catch (e) {
                console.log("جاري استخدام الوضع الافتراضي بانتظار مزامنة الخريطة.");
            }
        }

        fetchHouseMap();
        updateStageSettings(1);
    </script>
</body>
</html>
