<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظف الواقع المختلط - القائمة الرئيسية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        body {
            margin: 0;
            background: #070913;
            background-image: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #070913 70%);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            box-sizing: border-box;
        }

        .panel {
            background: rgba(11, 19, 38, 0.85);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(16, 185, 129, 0.4);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 30px rgba(16, 185, 129, 0.2);
            text-align: center;
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #34d399, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(52, 211, 153, 0.3);
        }

        p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.5);
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stats-bar div { font-size: 14px; color: #94a3b8; }
        .stats-bar span { color: #34d399; font-weight: 900; font-size: 16px; display: block; margin-top: 2px; }

        .section-title {
            font-size: 14px;
            color: #34d399;
            margin-bottom: 8px;
            text-align: right;
            font-weight: 700;
        }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: #111827;
            color: white;
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-size: 15px;
            font-family: 'Tajawal', sans-serif;
            margin-bottom: 20px;
            outline: none;
            text-align: right;
            cursor: pointer;
        }

        .game-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            margin-bottom: 12px;
            font-family: 'Tajawal', sans-serif;
        }

        .game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.6);
        }

        .btn-secondary {
            background: #1f293d;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: none;
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: #374151;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="panel">
            <h1>منظف الواقع المختلط</h1>
            <p>نظف بيتك الحقيقي عبر تتبع اليدين ووضع الـ Passthrough</p>

            <!-- معلومات عامة مسترجعة من التخزين المحلي -->
            <div class="stats-bar">
                <div>المرحلة الحالية: <span id="stageNum">1</span></div>
                <div>الرصيد المتاح: <span id="coinsVal">0.00</span> 🪙</div>
            </div>

            <!-- اختيار الطابق -->
            <div class="section-title">اختر الطابق المستهدف بالمنزل:</div>
            <select id="floorSelect">
                <option value="ground">الطابق الأرضي (Ground Floor)</option>
                <option value="first">الطابق الأول (First Floor)</option>
                <option value="second">الطابق الثاني (Second Floor)</option>
            </select>

            <!-- أزرار التشغيل -->
            <button class="game-btn" onclick="launchGame(false)">🚀 الدخول بالخريطة المسجلة (AR)</button>
            <button class="game-btn btn-secondary" onclick="launchGame(true)">⚡ فحص المكان الحالي سريعاً</button>
            <button class="game-btn" style="background: linear-gradient(135deg, #2563eb, #1d4ed8); box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);" onclick="openShop()">🛒 متجر التجهيزات</button>
        </div>
    </div>

    <script>
        // قراءة البيانات المخزنة مسبقاً إن وجدت
        let playerStats = {
            stage: localStorage.getItem('game_stage') || 1,
            coins: parseFloat(localStorage.getItem('game_coins') || 0.0)
        };

        document.getElementById('stageNum').innerText = playerStats.stage;
        document.getElementById('coinsVal').innerText = playerStats.coins.toFixed(2);

        function launchGame(isRescan) {
            const floor = document.getElementById('floorSelect').value;
            if (isRescan) {
                alert(`جاري تهيئة وضع المسح السريع للطابق (${floor})...`);
                // توجيه لصفحة المسح أو تفعيل الفحص
            } else {
                alert(`جاري تحميل خريطة الطابق (${floor}) وتفعيل بيئة الـ AR...`);
                // الانتقال لملف اللعبة أو تفعيل الجلسة
                window.location.href = 'game.html';
            }
        }

        function openShop() {
            alert("سيتم نقلك لمتجر الأدوات والمعدات قريباً.");
        }
    </script>
</body>
</html>
