<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظف الواقع المختلط</title>
    
    <!-- ربط ملف المينفيست الخارجي بالشكل الصحيح الذي يقبله PWABuilder -->
    <link rel="manifest" href="manifest.json">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body {
            margin: 0; background: #070913;
            background-image: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #070913 70%);
            color: #fff; font-family: 'Tajawal', sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .container { width: 100%; max-width: 440px; padding: 20px; box-sizing: border-box; }
        .panel {
            background: rgba(11, 19, 38, 0.9); backdrop-filter: blur(20px);
            border: 2px solid rgba(16, 185, 129, 0.4); border-radius: 24px; padding: 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 30px rgba(16, 185, 129, 0.2); text-align: center;
        }
        h1 { font-size: 26px; font-weight: 900; margin-bottom: 5px; background: linear-gradient(45deg, #34d399, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        .stats-bar {
            display: flex; justify-content: space-around; background: rgba(0, 0, 0, 0.5);
            padding: 14px; border-radius: 14px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05);
        }
        .stats-bar div { font-size: 14px; color: #94a3b8; }
        .stats-bar span { color: #34d399; font-weight: 900; font-size: 16px; display: block; margin-top: 2px; }
        .section-title { font-size: 14px; color: #34d399; margin-bottom: 8px; text-align: right; font-weight: 700; }
        select {
            width: 100%; padding: 14px; border-radius: 12px; background: #111827; color: white;
            border: 1px solid rgba(16, 185, 129, 0.3); font-size: 15px; font-family: 'Tajawal', sans-serif;
            margin-bottom: 20px; outline: none; text-align: right; cursor: pointer;
        }
        .game-btn {
            background: linear-gradient(135deg, #059669, #10b981); color: white; border: none;
            padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 900; width: 100%;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            margin-bottom: 12px; font-family: 'Tajawal', sans-serif;
        }
        .game-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(16, 185, 129, 0.6); }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <h1>منظف الواقع المختلط</h1>
            <p>نظف بيتك الحقيقي عبر تتبع اليدين ووضع الـ Passthrough</p>
            <div class="stats-bar">
                <div>المرحلة الحالية: <span id="stageNum">1</span></div>
                <div>الرصيد المتاح: <span id="coinsVal">0.00</span> 🪙</div>
            </div>
            <div class="section-title">اختر الطابق المستهدف بالمنزل:</div>
            <select id="floorSelect">
                <option value="ground">الطابق الأرضي (Ground Floor)</option>
                <option value="first">الطابق الأول (First Floor)</option>
                <option value="second">الطابق الثاني (Second Floor)</option>
            </select>
            <button class="game-btn" onclick="launchGame()">🚀 بدء تجربة الـ AR الحقيقية</button>
        </div>
    </div>
    <script>
        let playerStage = localStorage.getItem('game_stage') || 1;
        let playerCoins = parseFloat(localStorage.getItem('game_coins') || 0.0);
        
        document.getElementById('stageNum').innerText = playerStage;
        document.getElementById('coinsVal').innerText = playerCoins.toFixed(2);

        function launchGame() {
            const floor = document.getElementById('floorSelect').value;
            localStorage.setItem('selected_floor', floor);
            window.location.href = 'game.html';
        }
    </script>
</body>
</html>
